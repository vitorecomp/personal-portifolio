name: Trigger Deploy in personal-infra
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "components/**"
      - "content/**"
      - "styles/**"
      - "mdx-components.tsx"
      - "next.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch deploy-personal-portifolio to personal-infra
    runs-on: ubuntu-latest
    steps:
    - name: Send repository_dispatch event
      env:
        GH_TOKEN: ${{ secrets.PERSONAL_INFRA_TOKEN || secrets.METRICS_TOKEN }}
      run: |
        gh api repos/vitorecomp/personal-infra/dispatches \
          --method POST \
          -f event_type="deploy-personal-portifolio" \
          -f "client_payload[sha]=${{ github.sha }}"
