services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: personal-portifolio:prod
    container_name: personal-portifolio-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped

  dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: personal-portifolio:dev
    container_name: personal-portifolio-dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: pnpm dev
